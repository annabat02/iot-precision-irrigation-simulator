services:
  app:
    image: webdevops/php-nginx:8.3
    container_name: laravel_app
    working_dir: /app
    volumes:
      - ./app:/app
    ports:
      - "8000:80"
    environment:
      WEB_DOCUMENT_ROOT: /app/public
    depends_on:
      - mysql
    networks:
      - laravel

  mysql:
    image: mysql:8.4
    container_name: mysql_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kampus
      MYSQL_USER: mahasiswa
      MYSQL_PASSWORD: 123456
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - laravel

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
    depends_on:
      - mysql
    networks:
      - laravel

volumes:
  mysql_data:

networks:
  laravel: